<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake</title>

    <link href="snake game.css" rel="stylesheet" type="text/css">
</head>

<body>

   <h1>Snake</h1>

<div class="infoBar">

    <h2>Score: <span id="score">0</span></h2>

    <div class="speedControls">
        <h3>Speed:</h3>
        <button id="speedOne">🐌</button>
        <button id="speedTwo">🐍</button>
        <button id="speedThree">🐇</button>
    </div>

     </div>
    <div class="gameGlass">

    <canvas id="gameCanvas" width="640" height="360"></canvas>

    </div>

   

    <div class="gameControls">

        <button id="startButton">Start Game</button>

        <button id="gameOverButton">End Game</button>

    </div>

    <script src="snake game.js"></script>

</body>

</html>
